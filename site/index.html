<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto CI/CD</title>
    <style>
        body {
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }

        main {
            background: rgba(15, 23, 42, 0.75);
            border-radius: 16px;
            max-width: 650px;
            padding: 40px;
        }

        h1 {
            color: #7dd3fc;
        }

        .status {
            color: #86efac;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>Projeto CI/CD com GitHub Actions</h1>
        <p class="status">Deploy realizado com sucesso.</p>
        <p>
            Esta página é publicada automaticamente no GitHub Pages
            após um push ou merge na branch main.
        </p>
        <p>
            Projeto acadêmico com GitHub, Pull Requests,
            Continuous Integration, Continuous Delivery e Docker.
        </p>
    </main>
</body>
</html>
